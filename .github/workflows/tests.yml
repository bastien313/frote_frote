# Runs the test-suite on every push / pull request.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Simulation rapide du lieu 1 (équilibrage)
        run: node tools/sim.mjs 0 --minutes=45
